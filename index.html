<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abuja Life</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #063b22, #0b7a46);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo h1 {
      font-size: 42px;
      font-weight: 900;
      letter-spacing: -2px;
    }

    .logo span {
      color: #d9f99d;
    }

    .logo p {
      margin-top: 8px;
      color: #d9f5e6;
      font-size: 14px;
    }

    .card {
      background: white;
      color: #15231b;
      border-radius: 22px;
      padding: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
    }

    .tabs {
      display: flex;
      background: #edf5ef;
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 24px;
    }

    .tabs button {
      width: 50%;
      border: 0;
      padding: 12px;
      border-radius: 9px;
      background: transparent;
      cursor: pointer;
      font-weight: bold;
      color: #41604e;
    }

    .tabs button.active {
      background: #08783f;
      color: white;
    }

    h2 {
      margin-bottom: 8px;
      font-size: 24px;
    }

    .subtitle {
      color: #718078;
      font-size: 14px;
      margin-bottom: 22px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: bold;
      color: #34443a;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d4ded8;
      border-radius: 10px;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #08783f;
      box-shadow: 0 0 0 3px rgba(8,120,63,.1);
    }

    .main-btn {
      width: 100%;
      border: 0;
      padding: 15px;
      border-radius: 11px;
      background: #08783f;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    .main-btn:hover {
      background: #065f32;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 9px;
      display: none;
      font-size: 13px;
    }

    .message.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .message.success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .hidden {
      display: none;
    }

    .footer {
      text-align: center;
      margin-top: 18px;
      font-size: 12px;
      color: #d7eee1;
    }

    .starter {
      margin: 15px 0;
      padding: 12px;
      background: #f0fdf4;
      border-radius: 10px;
      color: #166534;
      font-size: 13px;
      text-align: center;
    }

    @media (max-width: 450px) {
      .card {
        padding: 22px;
      }

      .logo h1 {
        font-size: 36px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      <h1>ABUJA <span>LIFE</span></h1>
      <p>Your city. Your story. Your life.</p>
    </div>

    <div class="card">

      <div class="tabs">
        <button id="loginTab" class="active" onclick="showLogin()">
          Login
        </button>

        <button id="registerTab" onclick="showRegister()">
          Create Account
        </button>
      </div>

      <!-- LOGIN -->

      <div id="loginForm">

        <h2>Welcome back</h2>

        <p class="subtitle">
          Enter Abuja and continue your life.
        </p>

        <div class="form-group">
          <label>Email</label>
          <input
            id="loginEmail"
            type="email"
            placeholder="Enter your email"
          />
        </div>

        <div class="form-group">
          <label>Password</label>
          <input
            id="loginPassword"
            type="password"
            placeholder="Enter your password"
          />
        </div>

        <button class="main-btn" onclick="login()">
          Enter Abuja
        </button>

        <div id="loginMessage" class="message"></div>

      </div>


      <!-- REGISTER -->

      <div id="registerForm" class="hidden">

        <h2>Create your player</h2>

        <p class="subtitle">
          Start your life in Abuja.
        </p>

        <div class="form-group">
          <label>Username</label>
          <input
            id="registerUsername"
            type="text"
            placeholder="Choose your username"
          />
        </div>

        <div class="form-group">
          <label>Email</label>
          <input
            id="registerEmail"
            type="email"
            placeholder="Enter your email"
          />
        </div>

        <div class="form-group">
          <label>Password</label>
          <input
            id="registerPassword"
            type="password"
            placeholder="Create a password"
          />
        </div>

        <div class="form-group">
          <label>Confirm Password</label>
          <input
            id="registerConfirm"
            type="password"
            placeholder="Confirm your password"
          />
        </div>

        <div class="starter">
          🎁 New players start with
          <strong>₦1,000,000</strong>
          virtual game money.
        </div>

        <button class="main-btn" onclick="register()">
          Create Player
        </button>

        <div id="registerMessage" class="message"></div>

      </div>

    </div>

    <div class="footer">
      Abuja Life • Virtual game economy only
    </div>

  </div>


<script>

  function showLogin() {

    document.getElementById("loginForm").classList.remove("hidden");
    document.getElementById("registerForm").classList.add("hidden");

    document.getElementById("loginTab").classList.add("active");
    document.getElementById("registerTab").classList.remove("active");

  }


  function showRegister() {

    document.getElementById("loginForm").classList.add("hidden");
    document.getElementById("registerForm").classList.remove("hidden");

    document.getElementById("loginTab").classList.remove("active");
    document.getElementById("registerTab").classList.add("active");

  }


  function showMessage(id, text, type) {

    const element = document.getElementById(id);

    element.textContent = text;

    element.className = "message " + type;

  }


  async function register() {

    const username =
      document.getElementById("registerUsername").value.trim();

    const email =
      document.getElementById("registerEmail").value.trim();

    const password =
      document.getElementById("registerPassword").value;

    const confirm =
      document.getElementById("registerConfirm").value;


    if (!username || !email || !password || !confirm) {

      showMessage(
        "registerMessage",
        "Please complete all fields.",
        "error"
      );

      return;
    }


    if (password.length < 6) {

      showMessage(
        "registerMessage",
        "Password must be at least 6 characters.",
        "error"
      );

      return;
    }


    if (password !== confirm) {

      showMessage(
        "registerMessage",
        "Passwords do not match.",
        "error"
      );

      return;
    }


    showMessage(
      "registerMessage",
      "Creating your Abuja Life account...",
      "success"
    );


    try {

      const response = await fetch("/api/register", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          username,
          email,
          password
        })

      });


      const result = await response.json();


      if (!response.ok || !result.success) {

        showMessage(
          "registerMessage",
          result.message || "Registration failed.",
          "error"
        );

        return;
      }


      showMessage(
        "registerMessage",
        "Account created successfully. Entering Abuja...",
        "success"
      );


      setTimeout(() => {

        window.location.href = "/game.html";

      }, 1000);


    } catch (error) {

      showMessage(
        "registerMessage",
        "Unable to connect to Abuja Life server.",
        "error"
      );

    }

  }


  async function login() {

    const email =
      document.getElementById("loginEmail").value.trim();

    const password =
      document.getElementById("loginPassword").value;


    if (!email || !password) {

      showMessage(
        "loginMessage",
        "Please enter your email and password.",
        "error"
      );

      return;
    }


    showMessage(
      "loginMessage",
      "Checking your account...",
      "success"
    );


    try {

      const response = await fetch("/api/login", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          email,
          password
        })

      });


      const result = await response.json();


      if (!response.ok || !result.success) {

        showMessage(
          "loginMessage",
          result.message || "Login failed.",
          "error"
        );

        return;
      }


      localStorage.setItem(
        "abujaLifePlayer",
        JSON.stringify(result.player)
      );


      showMessage(
        "loginMessage",
        "Login successful. Entering Abuja...",
        "success"
      );


      setTimeout(() => {

        window.location.href = "/game.html";

      }, 700);


    } catch (error) {

      showMessage(
        "loginMessage",
        "Unable to connect to Abuja Life server.",
        "error"
      );

    }

  }

</script>

</body>
</html>
