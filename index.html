<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abuja Life</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #063b22, #0b7a46);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo h1 {
      font-size: 42px;
      font-weight: 900;
      letter-spacing: -2px;
    }

    .logo span {
      color: #d9f99d;
    }

    .logo p {
      margin-top: 8px;
      color: #d9f5e6;
      font-size: 14px;
    }

    .card {
      background: white;
      color: #15231b;
      border-radius: 22px;
      padding: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
    }

    .tabs {
      display: flex;
      background: #edf5ef;
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 24px;
    }

    .tabs button {
      width: 50%;
      border: 0;
      padding: 12px;
      border-radius: 9px;
      background: transparent;
      cursor: pointer;
      font-weight: bold;
      color: #41604e;
    }

    .tabs button.active {
      background: #08783f;
      color: white;
    }

    h2 {
      margin-bottom: 8px;
      font-size: 24px;
    }

    .subtitle {
      color: #718078;
      font-size: 14px;
      margin-bottom: 22px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: bold;
      color: #34443a;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d4ded8;
      border-radius: 10px;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #08783f;
      box-shadow: 0 0 0 3px rgba(8,120,63,.1);
    }

    .main-btn {
      width: 100%;
      border: 0;
      padding: 15px;
      border-radius: 11px;
      background: #08783f;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
      transition: .2s;
    }

    .main-btn:hover {
      background: #065f32;
    }

    .main-btn:disabled {
      opacity: .65;
      cursor: not-allowed;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 9px;
      display: none;
      font-size: 13px;
    }

    .message.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .message.success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .hidden {
      display: none;
    }

    .footer {
      text-align: center;
      margin-top: 18px;
      font-size: 12px;
      color: #d7eee1;
    }

    .starter {
      margin: 15px 0;
      padding: 12px;
      background: #f0fdf4;
      border-radius: 10px;
      color: #166534;
      font-size: 13px;
      text-align: center;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #166534;
      font-size: 14px;
    }

    @media (max-width: 450px) {
      .card {
        padding: 22px;
      }

      .logo h1 {
        font-size: 36px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      <h1>ABUJA <span>LIFE</span></h1>
      <p>Your city. Your story. Your life.</p>
    </div>

    <div class="card">

      <!-- LOGIN / REGISTER TABS -->

      <div class="tabs">
        <button
          id="loginTab"
          class="active"
          type="button"
          onclick="showLogin()"
        >
          Login
        </button>

        <button
          id="registerTab"
          type="button"
          onclick="showRegister()"
        >
          Create Account
        </button>
      </div>


      <!-- LOGIN -->

      <div id="loginForm">

        <h2>Welcome back</h2>

        <p class="subtitle">
          Enter Abuja and continue your life.
        </p>

        <div class="form-group">

          <label for="loginEmail">
            Email
          </label>

          <input
            id="loginEmail"
            type="email"
            autocomplete="email"
            placeholder="Enter your email"
          />

        </div>


        <div class="form-group">

          <label for="loginPassword">
            Password
          </label>

          <input
            id="loginPassword"
            type="password"
            autocomplete="current-password"
            placeholder="Enter your password"
          />

        </div>


        <button
          id="loginButton"
          class="main-btn"
          type="button"
          onclick="login()"
        >
          Enter Abuja
        </button>


        <div
          id="loginMessage"
          class="message"
        ></div>

      </div>


      <!-- REGISTER -->

      <div
        id="registerForm"
        class="hidden"
      >

        <h2>Create your player</h2>

        <p class="subtitle">
          Start your life in Abuja.
        </p>


        <div class="form-group">

          <label for="registerUsername">
            Username
          </label>

          <input
            id="registerUsername"
            type="text"
            autocomplete="username"
            placeholder="Choose your username"
          />

        </div>


        <div class="form-group">

          <label for="registerEmail">
            Email
          </label>

          <input
            id="registerEmail"
            type="email"
            autocomplete="email"
            placeholder="Enter your email"
          />

        </div>


        <div class="form-group">

          <label for="registerPassword">
            Password
          </label>

          <input
            id="registerPassword"
            type="password"
            autocomplete="new-password"
            placeholder="Create a password"
          />

        </div>


        <div class="form-group">

          <label for="registerConfirm">
            Confirm Password
          </label>

          <input
            id="registerConfirm"
            type="password"
            autocomplete="new-password"
            placeholder="Confirm your password"
          />

        </div>


        <div class="starter">
          🎁 New players start with
          <strong>₦1,000,000</strong>
          virtual game money.
        </div>


        <button
          id="registerButton"
          class="main-btn"
          type="button"
          onclick="register()"
        >
          Create Player
        </button>


        <div
          id="registerMessage"
          class="message"
        ></div>

      </div>

    </div>


    <div class="footer">
      Abuja Life • Virtual game economy only
    </div>

  </div>


<script>

  /*
   * ==========================================================
   * ABUJA LIFE AUTHENTICATION
   * ==========================================================
   *
   * The frontend talks to the Express server.
   *
   * Register:
   * POST /api/auth/register
   *
   * Login:
   * POST /api/auth/login
   *
   * Player:
   * GET /api/player/:userId
   *
   * ==========================================================
   */


  const API_BASE = "";


  /*
   * ----------------------------------------------------------
   * SWITCH TO LOGIN
   * ----------------------------------------------------------
   */

  function showLogin() {

    document
      .getElementById("loginForm")
      .classList.remove("hidden");

    document
      .getElementById("registerForm")
      .classList.add("hidden");


    document
      .getElementById("loginTab")
      .classList.add("active");

    document
      .getElementById("registerTab")
      .classList.remove("active");

  }


  /*
   * ----------------------------------------------------------
   * SWITCH TO REGISTER
   * ----------------------------------------------------------
   */

  function showRegister() {

    document
      .getElementById("loginForm")
      .classList.add("hidden");

    document
      .getElementById("registerForm")
      .classList.remove("hidden");


    document
      .getElementById("loginTab")
      .classList.remove("active");

    document
      .getElementById("registerTab")
      .classList.add("active");

  }


  /*
   * ----------------------------------------------------------
   * SHOW MESSAGE
   * ----------------------------------------------------------
   */

  function showMessage(id, text, type) {

    const element = document.getElementById(id);

    if (!element) {
      return;
    }

    element.textContent = text;

    element.className = "message " + type;

  }


  /*
   * ----------------------------------------------------------
   * HIDE MESSAGE
   * ----------------------------------------------------------
   */

  function hideMessage(id) {

    const element = document.getElementById(id);

    if (!element) {
      return;
    }

    element.textContent = "";

    element.className = "message";

  }


  /*
   * ----------------------------------------------------------
   * GET USER ID FROM SERVER RESPONSE
   * ----------------------------------------------------------
   *
   * This handles common response structures so the frontend
   * remains compatible with the backend.
   * ----------------------------------------------------------
   */

  function getUserId(result) {

    return (
      result?.user?.id ||
      result?.player?.user_id ||
      result?.player?.userId ||
      result?.user_id ||
      result?.userId ||
      null
    );

  }


  /*
   * ----------------------------------------------------------
   * SAVE PLAYER SESSION
   * ----------------------------------------------------------
   */

  function savePlayerSession(result) {

    const userId = getUserId(result);


    if (userId) {

      localStorage.setItem(
        "abujaLifeUserId",
        userId
      );

    }


    if (result?.user) {

      localStorage.setItem(
        "abujaLifeUser",
        JSON.stringify(result.user)
      );

    }


    if (result?.player) {

      localStorage.setItem(
        "abujaLifePlayer",
        JSON.stringify(result.player)
      );

    }


    /*
     * Save the complete authentication response as well.
     * This makes it easier for game.html to restore the
     * current player.
     */

    try {

      localStorage.setItem(
        "abujaLifeSession",
        JSON.stringify(result)
      );

    } catch (error) {

      console.warn(
        "Could not save complete session.",
        error
      );

    }

  }


  /*
   * ----------------------------------------------------------
   * GO TO GAME
   * ----------------------------------------------------------
   */

  function enterGame() {

    window.location.href = "/game.html";

  }


  /*
   * ----------------------------------------------------------
   * REGISTER PLAYER
   * ----------------------------------------------------------
   */

  async function register() {

    const username =
      document
        .getElementById("registerUsername")
        .value
        .trim();


    const email =
      document
        .getElementById("registerEmail")
        .value
        .trim();


    const password =
      document
        .getElementById("registerPassword")
        .value;


    const confirm =
      document
        .getElementById("registerConfirm")
        .value;


    /*
     * Validation
     */

    if (
      !username ||
      !email ||
      !password ||
      !confirm
    ) {

      showMessage(
        "registerMessage",
        "Please complete all fields.",
        "error"
      );

      return;

    }


    if (username.length < 3) {

      showMessage(
        "registerMessage",
        "Username must be at least 3 characters.",
        "error"
      );

      return;

    }


    if (password.length < 6) {

      showMessage(
        "registerMessage",
        "Password must be at least 6 characters.",
        "error"
      );

      return;

    }


    if (password !== confirm) {

      showMessage(
        "registerMessage",
        "Passwords do not match.",
        "error"
      );

      return;

    }


    /*
     * Disable button while registering
     */

    const button =
      document.getElementById("registerButton");

    button.disabled = true;

    button.textContent = "Creating Player...";


    showMessage(
      "registerMessage",
      "Creating your Abuja Life account...",
      "success"
    );


    try {

      const response = await fetch(
        API_BASE + "/api/auth/register",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            username,
            email,
            password
          })
        }
      );


      let result = {};

      try {

        result = await response.json();

      } catch (jsonError) {

        result = {};

      }


      /*
       * Backend error
       */

      if (!response.ok || !result.success) {

        showMessage(
          "registerMessage",
          result.message ||
          result.error ||
          "Registration failed.",
          "error"
        );

        button.disabled = false;
        button.textContent = "Create Player";

        return;

      }


      /*
       * Save the new player
       */

      savePlayerSession(result);


      /*
       * If the registration response did not contain the
       * player ID directly, try loading it using the returned
       * user ID.
       */

      const userId = getUserId(result);


      if (userId) {

        try {

          const playerResponse =
            await fetch(
              API_BASE +
              "/api/player/" +
              encodeURIComponent(userId)
            );


          if (playerResponse.ok) {

            const playerResult =
              await playerResponse.json();


            if (playerResult?.success) {

              const realPlayer =
                playerResult.player ||
                playerResult.data ||
                playerResult;


              localStorage.setItem(
                "abujaLifePlayer",
                JSON.stringify(realPlayer)
              );

            }

          }

        } catch (playerError) {

          console.warn(
            "Player profile could not be loaded immediately.",
            playerError
          );

        }

      }


      showMessage(
        "registerMessage",
        "Account created successfully. Entering Abuja...",
        "success"
      );


      /*
       * Give the player a short moment to see the success
       * message, then open the game.
       */

      setTimeout(
        enterGame,
        900
      );


    } catch (error) {

      console.error(
        "Registration error:",
        error
      );


      showMessage(
        "registerMessage",
        "Unable to connect to Abuja Life server.",
        "error"
      );


      button.disabled = false;
      button.textContent = "Create Player";

    }

  }


  /*
   * ----------------------------------------------------------
   * LOGIN PLAYER
   * ----------------------------------------------------------
   */

  async function login() {

    const email =
      document
        .getElementById("loginEmail")
        .value
        .trim();


    const password =
      document
        .getElementById("loginPassword")
        .value;


    /*
     * Validation
     */

    if (!email || !password) {

      showMessage(
        "loginMessage",
        "Please enter your email and password.",
        "error"
      );

      return;

    }


    /*
     * Disable button
     */

    const button =
      document.getElementById("loginButton");

    button.disabled = true;

    button.textContent = "Checking...";


    showMessage(
      "loginMessage",
      "Checking your account...",
      "success"
    );


    try {

      const response = await fetch(
        API_BASE + "/api/auth/login",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            email,
            password
          })
        }
      );


      let result = {};

      try {

        result = await response.json();

      } catch (jsonError) {

        result = {};

      }


      /*
       * Login failed
       */

      if (!response.ok || !result.success) {

        showMessage(
          "loginMessage",
          result.message ||
          result.error ||
          "Login failed.",
          "error"
        );

        button.disabled = false;
        button.textContent = "Enter Abuja";

        return;

      }


      /*
       * Save real player session
       */

      savePlayerSession(result);


      const userId = getUserId(result);


      /*
       * Load the real player profile from the database.
       */

      if (userId) {

        try {

          const playerResponse =
            await fetch(
              API_BASE +
              "/api/player/" +
              encodeURIComponent(userId)
            );


          if (playerResponse.ok) {

            const playerResult =
              await playerResponse.json();


            if (playerResult?.success) {

              const realPlayer =
                playerResult.player ||
                playerResult.data ||
                playerResult;


              localStorage.setItem(
                "abujaLifePlayer",
                JSON.stringify(realPlayer)
              );

            }

          }

        } catch (playerError) {

          console.warn(
            "Could not load player profile.",
            playerError
          );

        }

      }


      showMessage(
        "loginMessage",
        "Login successful. Entering Abuja...",
        "success"
      );


      setTimeout(
        enterGame,
        700
      );


    } catch (error) {

      console.error(
        "Login error:",
        error
      );


      showMessage(
        "loginMessage",
        "Unable to connect to Abuja Life server.",
        "error"
      );


      button.disabled = false;
      button.textContent = "Enter Abuja";

    }

  }


  /*
   * ----------------------------------------------------------
   * ENTER KEY SUPPORT
   * ----------------------------------------------------------
   */

  document
    .getElementById("loginPassword")
    .addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {

          login();

        }

      }
    );


  document
    .getElementById("registerConfirm")
    .addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {

          register();

        }

      }
    );


  /*
   * ----------------------------------------------------------
   * CHECK EXISTING SESSION
   * ----------------------------------------------------------
   *
   * If someone is already logged in, we don't make them
   * log in again.
   * ----------------------------------------------------------
   */

  async function checkExistingSession() {

    const userId =
      localStorage.getItem(
        "abujaLifeUserId"
      );


    if (!userId) {

      return;

    }


    try {

      const response =
        await fetch(
          API_BASE +
          "/api/player/" +
          encodeURIComponent(userId)
        );


      if (!response.ok) {

        return;

      }


      const result =
        await response.json();


      if (result?.success) {

        const player =
          result.player ||
          result.data ||
          result;


        localStorage.setItem(
          "abujaLifePlayer",
          JSON.stringify(player)
        );

      }


      /*
       * Existing valid player.
       *
       * We intentionally leave the login screen available
       * rather than automatically redirecting immediately.
       * This prevents accidental redirects while testing.
       */

    } catch (error) {

      console.warn(
        "Existing session check failed.",
        error
      );

    }

  }


  /*
   * Start session check.
   */

  document.addEventListener(
    "DOMContentLoaded",
    function() {

      checkExistingSession();

    }
  );

</script>

</body>
</html>
