<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Abuja Life</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:none}
html,body{height:100%;overflow:hidden;background:#0b1a12;color:#fff;font-family:Arial,sans-serif}
#c{position:fixed;inset:0;width:100%;height:100%}
.h{position:fixed;z-index:5;background:rgba(3,18,11,.85);border:1px solid #ffffff22;border-radius:12px;padding:6px 10px;font-size:13px}
#top{top:max(8px,env(safe-area-inset-top));left:8px}
#bal{color:#63e69a;font-weight:900}
#ms{top:68px;left:8px;display:none;color:#ffd447}
#mini{position:fixed;z-index:5;top:max(8px,env(safe-area-inset-top));right:8px;border:2px solid #ffffff44;border-radius:10px}
#pr{bottom:150px;left:50%;transform:translateX(-50%);display:none;background:#0a984c;font-weight:bold}
#toast{position:fixed;z-index:50;top:110px;left:50%;transform:translateX(-50%);background:#071c11;border:1px solid #245a3b;padding:10px 16px;border-radius:12px;opacity:0;transition:.3s;max-width:90%;text-align:center;pointer-events:none;font-size:14px}
#jb{position:fixed;z-index:6;left:18px;bottom:max(18px,env(safe-area-inset-bottom));width:120px;height:120px;border-radius:50%;background:#04170e99;border:2px solid #ffffff33}
#jk{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#0ca653cc}
.b{position:fixed;z-index:6;border:none;border-radius:50%;color:#fff;font-weight:bold;background:#0a984ce6;border:2px solid #ffffff44}
#bA{right:18px;bottom:max(40px,env(safe-area-inset-bottom));width:74px;height:74px;font-size:15px}
#bV{right:100px;bottom:max(24px,env(safe-area-inset-bottom));width:56px;height:56px;font-size:22px;background:#163526e6}
#bar{position:fixed;z-index:6;bottom:max(6px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:6px}
#bar button{width:44px;height:44px;border-radius:12px;border:1px solid #ffffff33;background:#04170ecc;color:#fff;font-size:20px}
#pan{position:fixed;inset:0;z-index:40;background:#0008;display:none;align-items:center;justify-content:center;padding:14px}
#pb{background:#071b11;border:1px solid #ffffff22;border-radius:18px;width:420px;max-width:100%;max-height:85vh;overflow:auto;touch-action:pan-y}
#pb h2{padding:14px 16px;background:linear-gradient(135deg,#0a7139,#06351f);position:sticky;top:0;display:flex;justify-content:space-between}
#pc{padding:14px;font-size:14px;line-height:1.6}
.btn{border:none;border-radius:10px;padding:10px 14px;background:#0ca653;color:#fff;font-weight:bold;margin:6px 6px 0 0}
.btn.d{background:#a72837}.btn.x{background:#26402f}
#ld{position:fixed;inset:0;z-index:99;background:radial-gradient(circle,#0d6135,#04150d 65%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-size:36px;font-weight:900}
#ld span{color:#45d98a}#ld i{display:block;width:200px;height:5px;background:#173b28;border-radius:9px;overflow:hidden}
#ld i b{display:block;width:40%;height:100%;background:#39d77f;animation:l 1.1s infinite}
@keyframes l{from{transform:translateX(-100%)}to{transform:translateX(300%)}}
#pz{position:fixed;inset:0;z-index:30;background:#0007;display:none;align-items:center;justify-content:center;font-size:30px;font-weight:900}
</style></head><body>
<div id="ld"><div>ABUJA <span>LIFE</span></div><i><b></b></i></div>
<canvas id="c"></canvas>
<div class="h" id="top"><b id="nm">Boss</b> · <span id="lv">Wuse</span><br><span id="bal">₦1,000,000</span></div>
<div class="h" id="ms"></div>
<canvas id="mini" width="100" height="100"></canvas>
<div class="h" id="pr"></div><div id="toast"></div><div id="pz">PAUSED</div>
<div id="jb"><div id="jk"></div></div>
<button class="b" id="bA">ACT</button><button class="b" id="bV">🚗</button>
<div id="bar"><button id="mM">🗺️</button><button id="mI">🎒</button><button id="mP">👤</button><button id="mS">⚙️</button></div>
<div id="pan"><div id="pb"><h2><span id="pt"></span><button class="btn x" style="margin:0;padding:4px 10px" onclick="closeP()">×</button></h2><div id="pc"></div></div></div>
<script>
const $=i=>document.getElementById(i),cv=$('c'),g=cv.getContext('2d'),mi=$('mini'),mg=mi.getContext('2d');
let W,H,D=Math.min(devicePixelRatio||1,2);
function rs(){W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D}
addEventListener('resize',rs);rs();
/* ---------- config / world ---------- */
const N=45,R=[0,14,28,42],BL=[3,17,31];
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const iso=(x,y,z=0)=>[(x-y)*32,(x+y)*16-z];
const onR=v=>R.some(r=>v>=r&&v<r+3);
const sh=(c,f)=>`rgb(${Math.min(255,c[0]*f)|0},${Math.min(255,c[1]*f)|0},${Math.min(255,c[2]*f)|0})`;
const poly=(p,f)=>{g.fillStyle=f;g.beginPath();p.forEach((q,i)=>i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]));g.closePath();g.fill()};
const fmt=n=>'₦'+Number(n||0).toLocaleString('en-NG');
const PAL=[[222,214,196],[188,204,184],[214,190,160],[170,190,210],[220,170,150],[200,200,210]];
const KIND=[['shop','office','house'],['dealer','park','shop'],['house','warehouse','office']];
const NAMES={shop:['Wuse Market','Abuja Mall','Kente Fashion','Chicken Hub'],office:['Zenith Tower','Unity Plaza','Tech Hub','Wuse Towers'],house:['Wuse Apartments','Estate Homes','Garden Villas','Residence Court'],warehouse:['Cargo Depot','Logistics Hub','Cold Store','Parts Store']};
const B=[],TR=[],LP=[];
KIND.forEach((row,bj)=>row.forEach((k,bi)=>{const bx=BL[bi],by=BL[bj];
 if(k==='park'){for(let i=0;i<22;i++)TR.push([bx+1+rnd()*9,by+1+rnd()*9])}
 else for(let q=0;q<4;q++){const x=bx+1+(q%2)*5,y=by+1+(q>>1)*5,dl=k==='dealer'&&q===0;
  const z=k==='office'?130+rnd()*80:k==='house'?70+rnd()*30:k==='warehouse'?50:dl?95:55+rnd()*25;
  B.push({x,y,w:4,h:4,z:z|0,c:PAL[(rnd()*6)|0],k:dl?'dealer':k,nm:dl?'Wuse Luxury Motors':NAMES[k][q],dx:x+2,dy:y+4.6,door:dl})}
 TR.push([bx+.5,by+.5],[bx+10.5,by+10.5]);LP.push([bx+.5,by+5.5],[bx+10.5,by+5.5],[bx+5.5,by+.5],[bx+5.5,by+10.5])}));
const blocked=(x,y)=>x<.4||y<.4||x>N-.4||y>N-.4||B.some(b=>x>b.x-.2&&x<b.x+b.w+.2&&y>b.y-.2&&y<b.y+b.h+.2);
/* ---------- vehicles ---------- */
const SH={moto:{l:.8,w:.28,h:7,ch:3},eco:{l:1.05,w:.58,h:9,ch:8},sedan:{l:1.3,w:.62,h:9,ch:8},suv:{l:1.35,w:.7,h:12,ch:10},sport:{l:1.35,w:.66,h:7,ch:6},van:{l:1.6,w:.7,h:16,ch:8},bus:{l:2.6,w:.8,h:24,ch:0},truck:{l:2.1,w:.74,h:18,ch:10}};
const VM={moto:.16,sport:.2,bus:.09,truck:.1};
const PC=[[220,60,50],[240,200,60],[200,200,205],[245,245,245],[30,30,34],[200,30,45],[40,90,170],[60,140,80]];
let CAT=[{id:'moto1',name:'City Rider 150',type:'moto',price:450000,col:PC[0]},{id:'eco1',name:'Nano Hatch',type:'eco',price:850000,col:PC[1]},{id:'sed1',name:'Camry-style Sedan',type:'sedan',price:2400000,col:PC[2]},{id:'van1',name:'Delivery Van',type:'van',price:4500000,col:PC[3]},{id:'suv1',name:'Luxury SUV',type:'suv',price:9000000,col:PC[4]},{id:'spt1',name:'Lagos Sprint GT',type:'sport',price:25000000,col:PC[5]}];
const guess=v=>{const s=((v.type||'')+' '+(v.name||v.title||'')).toLowerCase();return /moto|bike/.test(s)?'moto':/van|truck|deliver/.test(s)?'van':/suv|range|jeep/.test(s)?'suv':/sport|ferrari|lambo|gt/.test(s)?'sport':/mini|eco|hatch|small/.test(s)?'eco':'sedan'};
const cars=[];
function mk(o){const s=SH[o.type];return Object.assign({x:0,y:0,a:0,v:0,sp:0,vm:VM[o.type]||.12,ai:false,col:PC[(rnd()*8)|0]},o,{s})}
['h','v'].forEach(ax=>R.forEach(r=>[1,-1].forEach(dir=>{for(let i=0;i<2;i++){
 const t=['eco','sedan','suv','van','moto','bus','truck','sedan'][(rnd()*8)|0],line=r+1.5+dir*.55*(ax==='h'?1:-1);
 cars.push(mk({type:t,ai:true,ax,dir,line,pos:rnd()*N,max:.03+rnd()*.025,a:ax==='h'?(dir>0?0:Math.PI):(dir>0?Math.PI/2:-Math.PI/2)}))}})));
[[2.1,19],[2.1,25],[2.1,31],[6,24.4]].forEach((p,i)=>cars.push(mk({type:['sedan','suv','eco','moto'][i],x:p[0],y:p[1],a:i<3?Math.PI/2:0})));
let owned=[],drv=null;
/* ---------- state ---------- */
let userId=localStorage.getItem('abujaLifeUserId'),bal=1000000,uname='Boss',ch={};
try{ch=JSON.parse(localStorage.getItem('abujaLifeCharacter')||'{}')}catch(e){}
const SK=ch.skin||'#b8754f',HR=ch.hair||'#17110d',CL=ch.clothes||'#087f3f';
const P={x:6,y:22.8,fc:'d',mv:false},IP={x:6,y:8},cam={x:0,y:0};
let inside=null,T=0,paused=false,mmBig=false;
const joy={x:0,y:0},K={};
const MS={on:0,st:0},PU=[36.5,8.5],DR=[8.5,36.5];
const peds=['Chidi','Aisha','Emeka','Fatima','David','Blessing','Tunde','Ibrahim','Grace','Ada'].map((n,i)=>({n,bx:BL[i%3],by:BL[(i/3|0)%3],s:rnd()*40,v:.012+rnd()*.012,cw:rnd()<.5?1:-1,col:['#087f3f','#203b72','#8d2525','#ddd','#444'][i%5],sk:['#b8754f','#8e5337','#613523','#d49a70'][i%4],ph:rnd()*6,x:0,y:0,fc:'d'}));
const PL=['Abuja is busy today!','Have you seen the cars at Wuse Luxury Motors?','Delivery jobs pay well, boss.','Mind the traffic!','Wuse market is lively today.'];
/* ---------- net helpers ---------- */
async function post(u,b){try{const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});let d={};try{d=await r.json()}catch(e){}return{s:r.status,d}}catch(e){return null}}
async function load(){try{
 if(userId){const r=await fetch('/api/player/'+userId),d=await r.json();if(d.success){const p=d.player;uname=p.username||p.display_name||uname;bal=Number(p.wallet?.balance??p.balance??bal)}}
 const v=await (await fetch('/api/vehicles')).json();if(v.data&&v.data.length)CAT=v.data.slice(0,6).map((x,i)=>({id:x.id,name:x.name||x.title||'Vehicle',type:guess(x),price:+x.price||0,col:PC[i%8]}));
}catch(e){}hud()}
/* ---------- UI ---------- */
let tt;const toast=m=>{const t=$('toast');t.textContent=m;t.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>t.style.opacity=0,3000)};
function hud(){$('nm').textContent=uname;$('bal').textContent=fmt(bal);$('lv').textContent=inside?'Showroom':'Wuse • Abuja';const m=$('ms');if(MS.on){m.style.display='block';m.textContent=MS.st?'📦 Deliver the package → Gwarinpa side (yellow dot)':'📦 Collect the package (yellow dot)'}else m.style.display='none'}
function showP(t,h){$('pt').textContent=t;$('pc').innerHTML=h;$('pan').style.display='flex'}
function closeP(){$('pan').style.display='none'}
$('mM').onclick=()=>{mmBig=!mmBig;mi.width=mi.height=mmBig?260:100};
$('mI').onclick=()=>showP('🎒 Inventory','<b>Vehicles</b><br>'+(owned.length?owned.map(o=>'🚗 '+o.name).join('<br>'):'None yet — visit Wuse Luxury Motors.')+'<br><br><b>Properties</b><br>None yet.');
$('mP').onclick=()=>showP('👤 Profile',`<b>${uname}</b><br>Balance: ${fmt(bal)}<br>Vehicles owned: ${owned.length}<br><button class="btn" onclick="startM()">📦 Start delivery job</button>`);
$('mS').onclick=()=>showP('⚙️ Settings','Keyboard: WASD/arrows, E act, F vehicle, Shift run.<br><button class="btn" onclick="pause()">Pause</button><button class="btn d" onclick="logout()">Logout</button>');
function pause(){paused=!paused;closeP();$('pz').style.display=paused?'flex':'none'}
$('pz').onclick=pause;
function logout(){['abujaLifeUserId','abujaLifeUser','abujaLifePlayer','abujaLifeSession'].forEach(k=>localStorage.removeItem(k));location.href='/'}
/* ---------- input ---------- */
addEventListener('keydown',e=>{K[e.key.toLowerCase()]=1;if(e.key==='e'||e.key==='E')act();if(e.key==='f'||e.key==='F')veh();if(e.key==='Escape')closeP()});
addEventListener('keyup',e=>K[e.key.toLowerCase()]=0);
const jb=$('jb'),jk=$('jk');let jid=null;
function jm(e){const r=jb.getBoundingClientRect();let dx=(e.clientX-r.left-60)/60,dy=(e.clientY-r.top-60)/60;const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}joy.x=dx;joy.y=dy;jk.style.transform=`translate(${dx*35}px,${dy*35}px)`}
jb.addEventListener('pointerdown',e=>{jid=e.pointerId;jb.setPointerCapture(jid);jm(e)});
jb.addEventListener('pointermove',e=>{if(e.pointerId===jid)jm(e)});
['pointerup','pointercancel'].forEach(t=>jb.addEventListener(t,()=>{jid=null;joy.x=joy.y=0;jk.style.transform=''}));
$('bA').onclick=act;$('bV').onclick=veh;
function inp(){let x=joy.x,y=joy.y;if(Math.hypot(x,y)<.15)x=y=0;if(K.arrowleft||K.a)x--;if(K.arrowright||K.d)x++;if(K.arrowup||K.w)y--;if(K.arrowdown||K.s)y++;const l=Math.hypot(x,y);if(l>1){x/=l;y/=l}return[x,y]}
/* ---------- interaction ---------- */
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function nearest(){
 if(inside){if(IP.y>8.2)return{t:'Exit showroom',f:()=>{inside=null;hud()}};
  const i=CAT.findIndex((c,i)=>Math.hypot(IP.x-(2.5+(i%3)*3.5),IP.y-(2.5+(i>>1>0&&i>2?3:0)))<1.7);
  const j=CAT.findIndex((c,i)=>Math.hypot(IP.x-slot(i)[0],IP.y-slot(i)[1])<1.7);
  return j>=0?{t:'Inspect '+CAT[j].name,f:()=>offer(j)}:null}
 if(drv)return{t:'Exit vehicle',f:veh};
 const bd=B.find(b=>b.door&&Math.hypot(P.x-b.dx,P.y-b.dy)<1.4);if(bd)return{t:'Enter '+bd.nm,f:()=>{inside=bd;IP.x=6;IP.y=8;hud()}};
 const pd=peds.find(p=>dist(P,p)<1.4);if(pd)return{t:'Talk to '+pd.n,f:()=>toast(pd.n+': '+PL[(Math.random()*5)|0])};
 const cr=cars.filter(c=>dist(P,c)<1.9).sort((a,b)=>dist(P,a)-dist(P,b))[0];if(cr)return{t:'Enter vehicle (F)',f:()=>enter(cr)};
 return null}
function act(){if(paused)return;const n=nearest();n?n.f():toast('Nothing to interact with here.')}
function veh(){if(paused||inside)return;if(drv){const c=drv;for(const[ox,oy]of[[-Math.sin(c.a),Math.cos(c.a)],[Math.sin(c.a),-Math.cos(c.a)],[Math.cos(c.a),Math.sin(c.a)]]){const x=c.x+ox*1.1,y=c.y+oy*1.1;if(!blocked(x,y)){P.x=x;P.y=y;break}}
 c.ai=false;c.v=0;drv=null;toast('You left the vehicle.')}else{const c=cars.filter(c=>dist(P,c)<1.9).sort((a,b)=>dist(P,a)-dist(P,b))[0];c?enter(c):toast('Move closer to a vehicle.')}}
function enter(c){drv=c;c.ai=false;c.v=0;c.sp=0;toast('Driving '+c.type+' — ↑ accelerate, ←/→ steer, ↓ brake')}
const slot=i=>[2.5+(i%3)*3.5,i<3?2.6:5.6];
function offer(j){const v=CAT[j],ok=bal>=v.price;showP(v.name,`Type: ${v.type}<br>Price: <b>${fmt(v.price)}</b><br>Your balance: ${fmt(bal)}<br>${ok?'':'<span style="color:#ff6b78">Insufficient funds for this vehicle.</span><br>'}<button class="btn" onclick="buy(${j})">Purchase</button>`)}
async function buy(j){const v=CAT[j];closeP();if(bal<v.price)return toast('Insufficient funds.');
 const r=await post('/api/vehicles/buy',{userId,vehicleId:v.id});
 if(r&&r.s!==404){if(r.d.success){bal=Number(r.d.balance??bal-v.price);got(v)}else toast(r.d.message||r.d.error||'Purchase failed.');return}
 bal-=v.price;got(v);toast('Demo mode: /api/vehicles/buy not found, so this purchase is not saved.')}
function got(v){owned.push(v);cars.push(mk({type:v.type,col:v.col,x:11+owned.length*1.2,y:22.5,a:0}));hud();toast('You bought '+v.name+'! It is parked outside the dealership.')}
function startM(){MS.on=1;MS.st=0;closeP();hud();toast('Delivery started. Follow the yellow dot on the map.')}
async function doneM(){MS.on=0;const r=await post('/api/missions/complete',{userId,mission:'delivery_1'});
 if(r&&r.s!==404&&r.d.success)bal=Number(r.d.balance??bal+25000);else bal+=25000;hud();toast('Delivery complete! +₦25,000')}
/* ---------- update ---------- */
function move(p,lim){const[ix,iy]=inp();if(ix||iy){const sp=(K.shift?.055:.034),wx=ix+iy,wy=iy-ix,nx=p.x+wx*sp,ny=p.y+wy*sp;
 if(lim){p.x=Math.max(.5,Math.min(11.5,nx));p.y=Math.max(.5,Math.min(8.4,ny))}else{if(!blocked(nx,p.y))p.x=nx;if(!blocked(p.x,ny))p.y=ny}
 p.fc=Math.abs(ix)>Math.abs(iy)?(ix>0?'r':'l'):(iy>0?'d':'u');p.mv=true}else p.mv=false}
function drive(){const[ix,iy]=inp(),c=drv;c.v+=-iy*.006;c.v*=.985;if(Math.abs(c.v)>c.vm)c.v=Math.sign(c.v)*c.vm;
 c.a+=ix*.05*Math.min(1,Math.abs(c.v)*12)*(c.v>=0?1:-1);const co=Math.cos(c.a),si=Math.sin(c.a),nx=c.x+co*c.v,ny=c.y+si*c.v;
 if(blocked(nx,ny)||blocked(nx+co*.5,ny+si*.5))c.v*=-.3;else{c.x=nx;c.y=ny}P.x=c.x;P.y=c.y}
function update(){
 if(inside)move(IP,1);else if(drv)drive();else move(P);
 const ph=Math.floor(T/360)%2;
 cars.forEach(c=>{if(!c.ai)return;let tg=c.max;const green=c.ax==='h'?ph===0:ph===1;
  if(!green)R.forEach(r=>{const e=c.dir>0?r:r+3,dd=(e-c.pos)*c.dir;if(dd>0&&dd<1.5)tg=0});
  const co=Math.cos(c.a),si=Math.sin(c.a);
  cars.forEach(o=>{if(o===c)return;const dx=o.x-c.x,dy=o.y-c.y,ah=dx*co+dy*si,lt=Math.abs(-dx*si+dy*co);if(ah>0&&ah<2.2&&lt<.8)tg=0});
  c.sp+=(tg-c.sp)*.08;c.pos+=c.sp*c.dir;if(c.pos>N+2)c.pos=-2;if(c.pos<-2)c.pos=N+2;
  if(c.ax==='h'){c.x=c.pos;c.y=c.line}else{c.x=c.line;c.y=c.pos}});
 peds.forEach(p=>{const ox=p.x,oy=p.y;p.s+=p.v*p.cw;const s=((p.s%40)+40)%40,k=s/10|0,t=s%10;
  const q=[[.5+t,.5],[10.5,.5+t],[10.5-t,10.5],[.5,10.5-t]][k];p.x=p.bx+q[0];p.y=p.by+q[1];
  const ax=p.x-ox-(p.y-oy),ay=p.x-ox+p.y-oy;p.fc=Math.abs(ax)>Math.abs(ay)?(ax>0?'r':'l'):(ay>0?'d':'u')});
 const tg=MS.on?(MS.st?DR:PU):null;
 if(tg&&Math.hypot(P.x-tg[0],P.y-tg[1])<1.3){if(!MS.st){MS.st=1;toast('Package collected! Deliver it to the new marker.');hud()}else doneM()}
 const n=nearest(),pr=$('pr');if(n&&!paused){pr.style.display='block';pr.textContent=n.t+'  [E]'}else pr.style.display='none';
 const tp=inside?iso(IP.x,IP.y):iso(P.x,P.y);cam.x+=(tp[0]-cam.x)*.12;cam.y+=(tp[1]-cam.y)*.12;
 if(T%5===0)mini()}
/* ---------- drawing ---------- */
function tile(x,y,c){const a=iso(x,y),b=iso(x+1,y),d=iso(x+1,y+1),e=iso(x,y+1);g.fillStyle=g.strokeStyle=c;g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.lineTo(d[0],d[1]);g.lineTo(e[0],e[1]);g.closePath();g.fill();g.stroke()}
const vis=(x,y,m)=>{const s=iso(x,y);return Math.abs(s[0]-cam.x)<W/2+m&&s[1]-cam.y>-H*.55-m&&s[1]-cam.y<H*.45+m};
const night=()=>Math.max(0,Math.sin(T/2400))*.5;
function box(b){const{x,y,w,h,z,c}=b,p=iso,lit=night()>.12;
 poly([p(x,y+h,0),p(x+w,y+h,0),p(x+w,y+h,z),p(x,y+h,z)],sh(c,.85));
 poly([p(x+w,y+h,0),p(x+w,y,0),p(x+w,y,z),p(x+w,y+h,z)],sh(c,.62));
 poly([p(x,y,z),p(x+w,y,z),p(x+w,y+h,z),p(x,y+h,z)],sh(c,1.12));
 poly([p(x+.4,y+.4,z+6),p(x+w-.4,y+.4,z+6),p(x+w-.4,y+h-.4,z+6),p(x+.4,y+h-.4,z+6)],sh(c,.95));
 const wc=lit?'#ffe9a0':'#9ec9d8';
 for(let f=26;f<z-18;f+=30)for(let k=0;k<w;k++){
  poly([p(x+k+.25,y+h,f),p(x+k+.75,y+h,f),p(x+k+.75,y+h,f+15),p(x+k+.25,y+h,f+15)],wc);
  poly([p(x+w,y+k+.25,f),p(x+w,y+k+.75,f),p(x+w,y+k+.75,f+15),p(x+w,y+k+.25,f+15)],lit?'#e8c870':'#7fa8b8')}
 const dc=b.door?'#c79a1a':'#3b2a1f';
 poly([p(x+w/2-.45,y+h,0),p(x+w/2+.45,y+h,0),p(x+w/2+.45,y+h,28),p(x+w/2-.45,y+h,28)],dc);
 if(b.door){const s=iso(x+w/2,y+h,z+12);g.fillStyle='#fff';g.font='bold 11px Arial';g.textAlign='center';g.fillText(b.nm,s[0],s[1]);g.textAlign='left'}}
function prism(P2,z0,z1,c){const e=[];for(let i=0;i<P2.length;i++){const a=P2[i],b=P2[(i+1)%P2.length];e.push([a,b,a[0]+a[1]+b[0]+b[1]])}
 e.sort((m,n)=>m[2]-n[2]);e.forEach(([a,b],i)=>poly([iso(a[0],a[1],z0),iso(b[0],b[1],z0),iso(b[0],b[1],z1),iso(a[0],a[1],z1)],sh(c,.55+i*.09)));
 poly(P2.map(q=>iso(q[0],q[1],z1)),sh(c,1.08))}
function car(x,y,a,col,s){const co=Math.cos(a),si=Math.sin(a),pt=(l,w)=>[x+co*l-si*w,y+si*l+co*w],hl=s.l/2,hw=s.w/2;
 poly([pt(hl,hw),pt(hl,-hw),pt(-hl,-hw),pt(-hl,hw)].map(q=>iso(q[0],q[1])),'rgba(0,0,0,.25)');
 prism([pt(hl,hw),pt(hl,-hw),pt(-hl,-hw),pt(-hl,hw)],3,3+s.h,col);
 if(s.ch){const cw=hw*.85;prism([pt(hl*.3,cw),pt(hl*.3,-cw),pt(-hl*.65,-cw),pt(-hl*.65,cw)],3+s.h,3+s.h+s.ch,[150,205,225])}
 if(night()>.12){const f=iso(x+co*hl,y+si*hl,8);g.fillStyle='#fff7b0';g.beginPath();g.arc(f[0],f[1],3,0,7);g.fill()}}
function person(o,name){const[s,t]=iso(o.x,o.y),sw=o.mv!==false&&(o.s!==undefined||o.mv)?Math.sin(T*.35+(o.ph||0))*3:0,fc=o.fc;
 g.fillStyle='rgba(0,0,0,.28)';g.beginPath();g.ellipse(s,t,9,4,0,0,7);g.fill();
 g.fillStyle='#22262b';g.fillRect(s-5,t-10,4,10+sw);g.fillRect(s+1,t-10,4,10-sw);
 g.fillStyle=o.col||CL;g.fillRect(s-6,t-23,12,14);
 g.fillStyle=o.sk||SK;g.beginPath();g.arc(s,t-29,6,0,7);g.fill();
 g.fillStyle=o.hr||HR;g.beginPath();g.arc(s,t-30,6.2,Math.PI,fc==='u'?7:Math.PI*2);g.fill();
 g.fillStyle='#111';if(fc==='d'){g.fillRect(s-3,t-28,2,2);g.fillRect(s+1,t-28,2,2)}else if(fc==='l')g.fillRect(s-4,t-28,2,2);else if(fc==='r')g.fillRect(s+2,t-28,2,2);
 if(name){g.fillStyle='#fff';g.font='bold 11px Arial';g.textAlign='center';g.fillText(name,s,t-42);g.textAlign='left'}}
function tree(x,y){const[s,t]=iso(x,y);g.fillStyle='#0003';g.beginPath();g.ellipse(s,t,12,5,0,0,7);g.fill();g.fillStyle='#5a3d25';g.fillRect(s-2,t-16,4,16);
 g.fillStyle='#2f7a3d';g.beginPath();g.arc(s,t-26,13,0,7);g.fill();g.fillStyle='#3d9650';g.beginPath();g.arc(s-3,t-30,8,0,7);g.fill()}
function lamp(x,y){const[s,t]=iso(x,y);g.fillStyle='#444';g.fillRect(s-1,t-36,2,36);g.fillStyle=night()>.1?'#ffe9a0':'#bbb';g.beginPath();g.arc(s,t-38,3.5,0,7);g.fill();
 if(night()>.1){g.fillStyle='rgba(255,230,150,.18)';g.beginPath();g.arc(s,t-8,30,0,7);g.fill()}}
function sig(rx,ry){const[s,t]=iso(rx+3.3,ry+3.3),ph=Math.floor(T/360)%2;g.fillStyle='#333';g.fillRect(s-1,t-26,2,26);
 g.fillStyle=ph?'#e33':'#3d3';g.beginPath();g.arc(s-4,t-28,3,0,7);g.fill();g.fillStyle=ph?'#3d3':'#e33';g.beginPath();g.arc(s+4,t-28,3,0,7);g.fill()}
function renderOut(){
 for(let x=0;x<N;x++)for(let y=0;y<N;y++){if(!vis(x+.5,y+.5,40))continue;
  tile(x,y,onR(x)||onR(y)?'#343c3b':(onR(x-1)||onR(x+1)||onR(y-1)||onR(y+1))?'#b4b7ad':(x>=17&&x<28&&y>=17&&y<28)?'#4f8a4a':'#8f9d8a')}
 g.strokeStyle='#d7c979';g.lineWidth=2;g.setLineDash([14,12]);
 R.forEach(r=>{[[0,r+1.5,N,r+1.5],[r+1.5,0,r+1.5,N]].forEach(l=>{const a=iso(l[0],l[1]),b=iso(l[2],l[3]);g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke()})});g.setLineDash([]);
 const L=[];
 B.forEach(b=>{if(vis(b.x+2,b.y+2,420))L.push({d:b.x+b.y+4,f:()=>box(b)})});
 TR.forEach(p=>{if(vis(p[0],p[1],60))L.push({d:p[0]+p[1],f:()=>tree(p[0],p[1])})});
 LP.forEach(p=>{if(vis(p[0],p[1],60))L.push({d:p[0]+p[1],f:()=>lamp(p[0],p[1])})});
 R.forEach(rx=>R.forEach(ry=>{if(vis(rx+2,ry+2,60))L.push({d:rx+ry+6.6,f:()=>sig(rx,ry)})}));
 cars.forEach(c=>{if(vis(c.x,c.y,80))L.push({d:c.x+c.y,f:()=>car(c.x,c.y,c.a,c.col,c.s)})});
 peds.forEach(p=>{if(vis(p.x,p.y,80))L.push({d:p.x+p.y,f:()=>person(p)})});
 if(!drv)L.push({d:P.x+P.y,f:()=>person({x:P.x,y:P.y,fc:P.fc,mv:P.mv},uname)});
 const tg=MS.on?(MS.st?DR:PU):null;if(tg)L.push({d:tg[0]+tg[1],f:()=>{const[s,t]=iso(tg[0],tg[1]),b=Math.sin(T*.1)*5;g.fillStyle='rgba(255,212,71,.35)';g.fillRect(s-5,t-120,10,120);g.fillStyle='#ffd447';g.beginPath();g.moveTo(s,t-60+b);g.lineTo(s+10,t-72+b);g.lineTo(s,t-84+b);g.lineTo(s-10,t-72+b);g.fill()}});
 L.sort((a,b)=>a.d-b.d).forEach(o=>o.f())}
function renderIn(){const IW=12,IH=9;
 for(let x=0;x<IW;x++)for(let y=0;y<IH;y++)tile(x,y,(x+y)%2?'#c9c3b4':'#ddd7c8');
 poly([iso(0,0,0),iso(IW,0,0),iso(IW,0,110),iso(0,0,110)],'#2d5a43');poly([iso(0,0,0),iso(0,IH,0),iso(0,IH,110),iso(0,0,110)],'#244b37');
 const s=iso(IW/2,0,85);g.fillStyle='#ffd447';g.font='bold 20px Arial';g.textAlign='center';g.fillText('WUSE LUXURY MOTORS',s[0],s[1]);
 const ex=iso(6,IH);g.fillStyle='#fff';g.font='12px Arial';g.fillText('▼ EXIT',ex[0],ex[1]+14);g.textAlign='left';
 const L=[];CAT.forEach((v,i)=>{const[x,y]=slot(i);L.push({d:x+y,f:()=>{poly([iso(x-1,y-.8),iso(x+1,y-.8),iso(x+1,y+.8),iso(x-1,y+.8)],'#7b8f84');car(x,y,1,v.col,SH[v.type]);
  const t=iso(x,y,48);g.fillStyle='#fff';g.font='bold 10px Arial';g.textAlign='center';g.fillText(v.name,t[0],t[1]);g.fillStyle='#63e69a';g.fillText(fmt(v.price),t[0],t[1]+12);g.textAlign='left'}})});
 L.push({d:IP.x+IP.y,f:()=>person({x:IP.x,y:IP.y,fc:IP.fc||'u',mv:IP.mv},uname)});L.sort((a,b)=>a.d-b.d).forEach(o=>o.f())}
function render(){g.setTransform(D,0,0,D,0,0);g.fillStyle='#2c4a35';g.fillRect(0,0,W,H);
 g.save();g.translate(W/2-cam.x,H*.55-cam.y);inside?renderIn():renderOut();g.restore();
 const n=inside?0:night();if(n>0){g.fillStyle=`rgba(8,12,50,${n})`;g.fillRect(0,0,W,H)}}
function mini(){const w=mi.width,s=w/N;mg.fillStyle='#6f8f66';mg.fillRect(0,0,w,w);mg.fillStyle='#333';R.forEach(r=>{mg.fillRect(r*s,0,3*s,w);mg.fillRect(0,r*s,w,3*s)});
 B.forEach(b=>{mg.fillStyle=sh(b.c,.9);mg.fillRect(b.x*s,b.y*s,b.w*s,b.h*s)});
 const t=MS.on?(MS.st?DR:PU):null;if(t){mg.fillStyle='#ffd447';mg.fillRect(t[0]*s-3,t[1]*s-3,6,6)}
 mg.fillStyle='#fff';mg.beginPath();mg.arc(P.x*s,P.y*s,3,0,7);mg.fill()}
function frame(){requestAnimationFrame(frame);if(paused)return;T++;update();render()}
load().then(()=>{setTimeout(()=>{$('ld').style.display='none';toast('Welcome to Wuse, '+uname+'. The dealership is right here — press E at its door.');hud();frame()},600)});
</script></body></html>
